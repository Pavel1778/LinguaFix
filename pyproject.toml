[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linguafix"
version = "0.1.0"
description = "Automatic keyboard layout switcher for Debian GNOME (X11 and Wayland)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pavel1778" }]
keywords = ["keyboard", "layout", "switcher", "evdev", "wayland", "x11", "gnome"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment :: Gnome",
    "Topic :: Utilities",
]
dependencies = [
    "evdev>=1.6.0; sys_platform == 'linux'",
    "python-uinput>=1.0.1; sys_platform == 'linux'",
    "tomli>=2.0.1; python_version < '3.11'",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
tray = ["PyGObject>=3.42"]
dev = [
    "black>=24.0",
    "isort>=5.13",
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
linguafix = "linguafix.cli:main"

[project.urls]
Homepage = "https://github.com/Pavel1778/LinguaFix"
Repository = "https://github.com/Pavel1778/LinguaFix"
Issues = "https://github.com/Pavel1778/LinguaFix/issues"
Changelog = "https://github.com/Pavel1778/LinguaFix/releases"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linguafix = ["data/*.json", "data/*.txt", "data/*.svg"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
# RUF001-003 flag Cyrillic characters that resemble Latin ones; the project
# deliberately uses Russian text in user-facing strings and tests.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = false
files = ["src/linguafix", "tests"]
exclude = ["build", "dist"]

[[tool.mypy.overrides]]
module = ["uinput.*", "gi.*", "tomli.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
# Tests intentionally poke at private attributes and use loose fixtures.
disable_error_code = ["attr-defined", "func-returns-value", "arg-type", "list-item"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["linguafix"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
