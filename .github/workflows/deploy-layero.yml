name: Deploy landing (Layero)

# Layero hosts the Russian landing page. Unlike Vercel it does not deploy from
# the GitHub integration on its own, so this workflow runs the CLI after every
# landing-page change on ``main``.
#
# Add the token once: Layero dashboard -> account -> API token, then
# ``Settings -> Secrets and variables -> Actions -> New secret`` named
# ``LAYERO_TOKEN``. Without it the job warns and skips instead of failing, so a
# fork or a repo without the secret still gets a green run.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-layero.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layero-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy site/ to Layero
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build landing page
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Deploy to Layero
        working-directory: site
        env:
          LAYERO_TOKEN: ${{ secrets.LAYERO_TOKEN }}
        run: |
          if [ -z "${LAYERO_TOKEN}" ]; then
            echo "::warning::LAYERO_TOKEN is not configured; skipping Layero deploy."
            {
              echo "### Layero deploy skipped"
              echo ""
              echo "Set the \`LAYERO_TOKEN\` Actions secret to publish the Russian site automatically."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          npx --yes layero@latest deploy
          {
            echo "### Layero deploy finished"
            echo ""
            echo "Verify: \`curl -s --compressed https://linguafix.layero.app/dictionaries/ | grep -i Скачать\`"
          } >> "${GITHUB_STEP_SUMMARY}"
