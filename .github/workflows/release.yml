name: Release

on:
  push:
    # Only real release tags (``v0.2.0``) publish a release; stage tags such as
    # ``stage-1`` must not, or the release would ship the previous version's
    # ``.deb`` under a stage name.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build .deb and publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          python -m pip install --upgrade pip build

      - name: Build .deb
        run: bash scripts/build_deb.sh

      - name: Smoke-test the .deb in a clean Debian container
        run: bash scripts/smoke_test.sh

      - name: Prove the .deb installs with no manual step (zero-config)
        run: bash scripts/deb_selfsufficiency_test.sh

      - name: Build source distribution
        run: python -m build --sdist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.deb *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Stage dictionary assets
        run: |
          # Ship the frequency dictionaries as standalone release assets so they
          # can be downloaded directly (and so ``linguafix dict download`` finds
          # them at the stable /releases/latest/download/<lang>-50k.txt URL).
          mkdir -p dist/dictionaries
          cp dictionaries/*-50k.txt dist/dictionaries/
          cp dictionaries/README.md dist/dictionaries/README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            dist/dictionaries/*-50k.txt
          generate_release_notes: true
