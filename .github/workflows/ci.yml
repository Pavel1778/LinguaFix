name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install evdev

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Mypy
        run: mypy --strict .

      - name: Pytest
        run: pytest tests/ -q --cov=linguafix --cov-report=term-missing --cov-fail-under=80

  gui:
    name: GUI (GTK4 under xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev xvfb pkg-config \
            libcairo2-dev libgirepository1.0-dev \
            gir1.2-gtk-4.0 gir1.2-adw-1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"
          pip install evdev

      - name: Pytest (GUI included in coverage)
        run: |
          xvfb-run -a pytest tests/ -q \
            --cov=linguafix --cov-config=coverage-gui.rc \
            --cov-report=term-missing --cov-fail-under=85
