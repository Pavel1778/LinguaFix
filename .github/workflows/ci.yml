name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install evdev

      - name: Ruff
        run: ruff check .

      - name: isort
        run: isort --check-only .

      - name: Black
        run: black --check .

      - name: Mypy
        run: mypy --strict .

      - name: Pytest
        run: pytest tests/ -q --cov=linguafix --cov-report=term-missing --cov-fail-under=80

  gui:
    name: GUI (GTK4 under xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev xvfb \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1

      # PyGObject comes from the distribution (``python3-gi``) rather than a
      # source build: building it needs ``girepository-2.0``, which Ubuntu's
      # dev packages do not provide, so ``pip install PyGObject`` fails during
      # metadata generation. The interpreter is 3.12, matching the distro's
      # ``gi`` ABI; ``PYTHONPATH`` points the pytest run at Debian's
      # ``dist-packages`` so ``import gi`` resolves. The ``gui`` extra is not
      # installed, so pip never tries to build PyGObject.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install evdev

      - name: Pytest (GUI included in coverage)
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages xvfb-run -a python -m pytest tests/ -q \
            --cov=linguafix --cov-config=coverage-gui.rc \
            --cov-report=term-missing --cov-fail-under=85

  package:
    name: Build .deb (downloadable artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      # Build the same ``.deb`` the release job publishes, so a reviewer can
      # install and test the exact artifact from the PR's Checks page without
      # cloning and building by hand. The version comes from ``pyproject.toml``.
      - name: Build .deb
        run: bash scripts/build_deb.sh

      - name: Write SHA256
        run: |
          cd dist
          sha256sum *.deb | tee SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Build every thematic archive in the same way the release job does, and
      # assert each contains the member ``dict install`` searches for. Without
      # this a renamed category file would only fail at release time.
      - name: Build thematic dictionary archives
        run: bash scripts/build_dict_archives.sh dist/dict-archives

      - name: Verify thematic archives are usable
        run: |
          set -euo pipefail
          for archive in dist/dict-archives/linguafix-dict-*.tar.gz; do
            slug="$(basename "${archive}" | sed -E 's/^linguafix-dict-(.*)\.tar\.gz$/\1/')"
            for lang in ru en; do
              member="${lang}-${slug}-1k.txt"
              if ! tar -tzf "${archive}" | grep -q "/${member}$"; then
                echo "::error::${archive} is missing ${member}"
                exit 1
              fi
            done
          done
          echo "All thematic archives contain their ru/en members."

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: linguafix-deb
          path: |
            dist/*.deb
            dist/SHA256SUMS.txt
          if-no-files-found: error

  site:
    name: Landing page build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build
